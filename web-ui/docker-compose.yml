services:
  # Backend service
  backend:
    image: yuxizhe/hyper-rag-backend:latest
    container_name: hyperrag-backend
    volumes:
      - hyperrag_cache_data:/app/hyperrag_cache
      - ../hyperrag:/app/hyperrag:ro
    networks:
      - hyperrag-network
    # expose:
    #   - "8000"  # Internal network exposure only
    restart: unless-stopped

  # Frontend service
  frontend:
    image: yuxizhe/hyper-rag-frontend:latest
    container_name: hyperrag-frontend
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - hyperrag-network
    # expose:
    #   - "5000"  # Internal network exposure only
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: hyperrag-nginx
    depends_on:
      - frontend
      - backend
    networks:
      - hyperrag-network
    ports:
      - "5000:5000" # Expose port 5000 externally
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

networks:
  hyperrag-network:
    driver: bridge

volumes:
  hyperrag_cache_data:
